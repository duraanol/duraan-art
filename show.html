<style>
  body.kiosk { overflow: hidden; height: 100vh; background: #0c0c0c; color: #f3f1eb; cursor: none; }
  body.kiosk main { max-width: none; padding: 0; height: 100vh; display: grid; grid-template-rows: 1fr auto; }
  body.kiosk .show { padding: 3vh 3vw 0; min-height: 0; display: grid; grid-template-rows: 1fr auto; }
  body.kiosk .show-frame { aspect-ratio: auto; height: 100%; border: 0; background: #0c0c0c; cursor: none; }
  body.kiosk .slide { transform: scale(1); transition: opacity 1200ms ease, transform 10s linear; }
  body.kiosk .slide.on { transform: scale(1.03); }
  body.kiosk .slide { background-color: #0c0c0c; }
  body.kiosk .show-bar { padding: 1vh 0 0; }
  body.kiosk .show-title { font-size: clamp(28px, 4vw, 56px); }
  body.kiosk .show-count { display: inline; color: #777; }
  body.kiosk .show-btn { width: 48px; height: 48px; border-color: #f3f1eb; color: #f3f1eb; }
  body.kiosk .show-btn:hover { background: #f3f1eb; color: #0c0c0c; }
  body.kiosk .fs { position: fixed; top: 12px; right: 12px; z-index: 5; padding: 8px 14px; border: 2px solid #f3f1eb; background: rgba(12,12,12,0.7); color: #f3f1eb; font: 500 14px var(--body); cursor: pointer; }
  body.kiosk:fullscreen .fs, body.kiosk .fs.hide { display: none; }
  body.kiosk .show-progress { background: #2a2a2a; margin: 1vh 0 0; }
  body.kiosk .kiosk-foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 2vh 3vw 3vh; border-top: 3px solid #f3f1eb; }
  body.kiosk .kiosk-brand { display: flex; align-items: center; gap: clamp(20px, 3vw, 48px); min-width: 0; }
  body.kiosk .signature { margin: 0; flex: none; }
  body.kiosk .sig { width: clamp(220px, 22vw, 420px); }
  body.kiosk .sig path { fill: #f3f1eb; stroke: #f3f1eb; }
  body.kiosk .reflection { font-size: clamp(24px, 3vw, 48px); background-image: linear-gradient(110deg, #6a6760 0 38%, #f3f1eb 50%, #6a6760 62% 100%); }
  body.kiosk .kiosk-sub { font-size: clamp(16px, 1.6vw, 26px); line-height: 1.4; }
  body.kiosk .kiosk-sub strong { color: #e3243d; }
  body.kiosk .kiosk-qr { display: flex; align-items: center; gap: 16px; }
  body.kiosk .kiosk-qr img { width: clamp(110px, 14vw, 220px); height: auto; border: 8px solid #fff; background: #fff; }
  body.kiosk .kiosk-qr span { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 2.6vw, 44px); line-height: 1; }
  body.kiosk .kiosk-qr small { display: block; font-family: var(--body); font-weight: 500; font-size: clamp(13px, 1.2vw, 20px); color: #a9a59c; margin-top: 6px; }
  body.kiosk .hint { position: fixed; top: 16px; left: 14px; font-size: 12px; color: #777; margin: 0; }
  body.kiosk:hover { cursor: default; }
  body.kiosk.idle .hint, body.kiosk.idle .fs, body.kiosk.idle .show-btn { opacity: 0; transition: opacity 600ms; }
  body.kiosk.idle { cursor: none; }

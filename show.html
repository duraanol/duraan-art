<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duraan.art · table mode</title>
<meta name="robots" content="noindex, noai, noimageai">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body.kiosk { overflow: hidden; height: 100vh; background: #0c0c0c; color: #f3f1eb; cursor: none; }
  body.kiosk main { max-width: none; padding: 0; height: 100vh; display: grid; grid-template-rows: 1fr auto; }
  body.kiosk .show { padding: 3vh 3vw 0; min-height: 0; display: grid; grid-template-rows: 1fr auto; }
  body.kiosk .show-frame { aspect-ratio: auto; height: 100%; border: 0; background: #0c0c0c; cursor: none; }
  body.kiosk .slide { background-color: #0c0c0c; }
  body.kiosk .show-bar { padding: 1vh 0 0; }
  body.kiosk .show-title { font-size: clamp(28px, 4vw, 56px); }
  body.kiosk .show-count { display: inline; color: #777; }
  body.kiosk .show-btn { width: 48px; height: 48px; border-color: #f3f1eb; color: #f3f1eb; }
  body.kiosk .show-btn:hover { background: #f3f1eb; color: #0c0c0c; }
  body.kiosk .fs { position: fixed; top: 12px; right: 12px; z-index: 5; padding: 8px 14px; border: 2px solid #f3f1eb; background: rgba(12,12,12,0.7); color: #f3f1eb; font: 500 14px var(--body); cursor: pointer; }
  body.kiosk:fullscreen .fs, body.kiosk .fs.hide { display: none; }
  body.kiosk .show-progress { background: #2a2a2a; margin: 1vh 0 0; }
  body.kiosk .kiosk-foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 2vh 3vw 3vh; border-top: 3px solid #f3f1eb; }
  body.kiosk .kiosk-name { font-family: var(--display); font-weight: 900; font-size: clamp(40px, 6vw, 96px); line-height: 0.9; text-transform: uppercase; }
  body.kiosk .kiosk-sub { font-size: clamp(16px, 1.8vw, 24px); margin-top: 8px; }
  body.kiosk .kiosk-sub strong { color: #e3243d; }
  body.kiosk .kiosk-qr { display: flex; align-items: center; gap: 16px; }
  body.kiosk .kiosk-qr img { width: clamp(90px, 12vw, 170px); height: auto; border: 6px solid #fff; background: #fff; }
  body.kiosk .kiosk-qr span { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 2.6vw, 40px); }
  body.kiosk .hint { position: fixed; top: 16px; left: 14px; font-size: 12px; color: #777; margin: 0; }
  body.kiosk:hover { cursor: default; }
  body.kiosk.idle .hint, body.kiosk.idle .fs, body.kiosk.idle .show-btn { opacity: 0; transition: opacity 600ms; }
  body.kiosk.idle { cursor: none; }
</style>
</head>
<body class="kiosk">
<main data-page="show">
  <div class="show" id="show" aria-roledescription="carousel" aria-label="Featured pieces">
    <div class="show-frame" id="show-frame"></div>
    <div class="show-bar">
      <button class="show-btn" id="show-prev" aria-label="Previous piece">&lsaquo;</button>
      <div class="show-meta"><span class="show-title" id="show-title"></span><span class="show-count" id="show-count"></span></div>
      <button class="show-btn" id="show-play" aria-label="Pause" aria-pressed="false">&#10074;&#10074;</button>
      <button class="show-btn" id="show-next" aria-label="Next piece">&rsaquo;</button>
    </div>
    <div class="show-progress"><span id="show-progress"></span></div>
  </div>
  <div class="kiosk-foot">
    <div>
      <div class="kiosk-name">Duraan.art</div>
      <div class="kiosk-sub">Custom character art, Ink, and flash designs. No AI ever. <strong id="kiosk-status">Commissions open.</strong><br>Instagram <strong>@duraan.art</strong></div>
    </div>
    <div class="kiosk-qr"><img src="/images/qr.png" alt="QR code for duraan.art"><span>Scan me</span></div>
  </div>
</main>
<button class="fs" id="fs" type="button">Fullscreen</button>
<p class="hint">F fullscreen · arrows skip · space pause · Esc back to site</p>
<script src="/gallery.js"></script>
<script src="/site.js"></script>
<script>
  (function () {
    if (window.SITE && window.SITE.commissions === "closed") document.getElementById("kiosk-status").textContent = "Commissions closed.";
    function toggleFs() { var el = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(function () {}); }
    document.getElementById("fs").addEventListener("click", toggleFs);
    if (!document.documentElement.requestFullscreen) document.getElementById("fs").classList.add("hide");
    var hideT; function showHint() { document.body.classList.remove("idle"); clearTimeout(hideT); hideT = setTimeout(function () { document.body.classList.add("idle"); }, 4000); }
    ["mousemove", "touchstart", "keydown"].forEach(function (ev) { document.addEventListener(ev, showHint, { passive: true }); }); showHint();
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !document.fullscreenElement) window.location.href = "/";
      if (e.key === "f" || e.key === "F") toggleFs();
      if (e.key === " ") { e.preventDefault(); document.getElementById("show-play").click(); }
    });
    var wl = null;
    document.addEventListener("click", function () { if (navigator.wakeLock && !wl) navigator.wakeLock.request("screen").then(function (l) { wl = l; }).catch(function () {}); });
  })();
</script>
</body>
</html>
